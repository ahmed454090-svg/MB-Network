<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FTCF | Professional Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { 
            background-color: #030712; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            margin: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-panel { 
            background: rgba(17, 24, 39, 0.75); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .tab-content { display: none; height: 100vh; width: 100vw; position: relative; }
        .tab-content.active { display: block; }
        iframe { width: 100%; height: 100%; border: none; }

        .splash-circle-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .outer-blue-circle {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #38bdf8;
            border-right-color: #0284c7;
            animation: spinClockwise 2.5s linear infinite;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .inner-white-circle {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 2px dashed #ffffff;
            animation: spinCounterClockwise 1.8s linear infinite;
            opacity: 0.9;
        }

        @keyframes spinClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinCounterClockwise { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

        .pulse-subtext { animation: pulseSubtext 1.8s ease-in-out infinite alternate; }
        @keyframes pulseSubtext { from { opacity: 0.6; letter-spacing: 0.2em; } to { opacity: 1; letter-spacing: 0.3em; } }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(245, 158, 11, 0.5);
            transition: all 0.2s ease;
        }
        .pin-dot.filled {
            background-color: #f59e0b;
            border-color: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }
    </style>
</head>
<body class="text-slate-100 antialiased selection:bg-amber-500 selection:text-black">

    <!-- PASSCODE LOCK SCREEN MODAL -->
    <div id="lock-screen" class="fixed inset-0 z-[9000] bg-black/95 backdrop-blur-2xl flex flex-col justify-center items-center p-6 overflow-y-auto">
        <div class="absolute w-64 h-64 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="splash-circle-container mb-3 relative z-10">
            <div class="outer-blue-circle"></div>
            <div class="inner-white-circle"></div>
            <span class="text-2xl font-black tracking-wider text-white drop-shadow-[0_2px_8px_rgba(56,189,248,0.5)] z-10">FTCF</span>
        </div>

        <p class="text-sky-300 font-mono text-[10px] font-bold uppercase tracking-[0.25em] pulse-subtext mb-6 relative z-10">Secure Portal</p>

        <h2 id="lock-title" class="text-white text-base font-bold mb-1 relative z-10">Set Security PIN</h2>
        <p id="lock-subtitle" class="text-slate-400 text-xs mb-5 font-mono relative z-10">Choose a 4-digit PIN for portal protection</p>

        <!-- PIN Dots Indicator -->
        <div class="flex gap-4 mb-6 relative z-10">
            <div class="pin-dot" id="dot-0"></div>
            <div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div>
        </div>

        <!-- Keypad -->
        <div class="grid grid-cols-3 gap-3 max-w-xs w-full mb-4 relative z-10">
            <button type="button" onclick="pressPin('1')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">1</button>
            <button type="button" onclick="pressPin('2')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">2</button>
            <button type="button" onclick="pressPin('3')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">3</button>
            <button type="button" onclick="pressPin('4')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">4</button>
            <button type="button" onclick="pressPin('5')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">5</button>
            <button type="button" onclick="pressPin('6')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">6</button>
            <button type="button" onclick="pressPin('7')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">7</button>
            <button type="button" onclick="pressPin('8')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">8</button>
            <button type="button" onclick="pressPin('9')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">9</button>
            <button type="button" onclick="resetPinStorage()" class="h-12 glass-panel rounded-2xl text-xs font-semibold text-amber-400 active:scale-90">Reset</button>
            <button type="button" onclick="pressPin('0')" class="h-12 glass-panel rounded-2xl text-xl font-bold text-white active:scale-90">0</button>
            <button type="button" onclick="deletePin()" class="h-12 glass-panel rounded-2xl text-white active:scale-90 flex items-center justify-center">
                <i data-lucide="delete" class="w-5 h-5"></i>
            </button>
        </div>
        
        <p id="lock-error" class="text-red-400 text-xs font-semibold h-4 text-center relative z-10"></p>
    </div>

    <!-- Header Controls -->
    <header class="fixed top-4 right-4 z-[60] flex gap-2">
        <button type="button" onclick="resetPinStorage()" title="Reset PIN" class="w-10 h-10 rounded-2xl glass-panel flex items-center justify-center text-slate-300 hover:text-amber-500">
            <i data-lucide="key-round" class="w-4 h-4"></i>
        </button>
        <button type="button" onclick="toggleModal('bank-popup', true)" class="w-10 h-10 rounded-2xl glass-panel flex items-center justify-center text-slate-300 hover:text-amber-500">
            <i data-lucide="building-2" class="w-4 h-4"></i>
        </button>
        <button type="button" onclick="toggleModal('notice-popup', true)" class="relative w-10 h-10 rounded-2xl glass-panel flex items-center justify-center text-slate-300 hover:text-amber-500">
            <i data-lucide="bell" class="w-4 h-4"></i>
            <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-red-500 rounded-full ring-2 ring-black"></span>
        </button>
    </header>

    <!-- Bank Modal -->
    <div id="bank-popup" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/70 backdrop-blur-md">
        <div class="glass-panel p-6 rounded-3xl w-full max-w-sm text-center border border-white/10">
            <div class="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="building-2" class="w-6 h-6"></i>
            </div>
            <h2 class="text-white text-base font-bold mb-4">HBL Konnect Details</h2>
            <div class="bg-black/40 p-4 rounded-2xl text-left border border-white/5 space-y-3 mb-6">
                <div>
                    <span class="text-[10px] uppercase font-mono tracking-wider text-slate-400 block">Account Title</span>
                    <span class="text-sm text-white font-semibold">Afzaal Ahmed</span>
                </div>
                <div class="pt-2 border-t border-white/5 flex justify-between items-center">
                    <div>
                        <span class="text-[10px] uppercase font-mono tracking-wider text-slate-400 block">Account / Mobile</span>
                        <span class="text-sm text-amber-400 font-mono font-bold">0342-2735966</span>
                    </div>
                </div>
            </div>
            <button type="button" onclick="toggleModal('bank-popup', false)" class="w-full py-3 bg-white/10 rounded-xl text-white font-medium text-sm">Close</button>
        </div>
    </div>

    <!-- Notice Modal -->
    <div id="notice-popup" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/70 backdrop-blur-md">
        <div class="glass-panel p-6 rounded-3xl w-full max-w-sm border border-white/10">
            <div class="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-2xl flex items-center justify-center mb-4">
                <i data-lucide="megaphone" class="w-6 h-6"></i>
            </div>
            <h2 class="text-white text-base font-bold mb-2">System Notice</h2>
            <p class="text-slate-400 text-xs leading-relaxed mb-6">
                مصروفیت کی وجہ سے میٹنگ نہیں ہو سکی، انشاء اللہ آئندہ کا لائحہ عمل آپ کو واٹس ایپ گروپ کے ذریعے بتا دیا جائے گا۔
            </p>
            <button type="button" onclick="toggleModal('notice-popup', false)" class="w-full py-3 bg-amber-500 text-black rounded-xl font-semibold text-sm">Acknowledge</button>
        </div>
    </div>

    <!-- Tab Contents -->
    <div id="ledger" class="tab-content" data-src="https://ftcf20-hub.github.io/FTCF.com/"></div>
    <div id="monthly" class="tab-content" data-src="https://ftcf20-hub.github.io/Monthly-Status/"></div>
    <div id="yearly" class="tab-content" data-src="https://ftcf20-hub.github.io/Yearly-Record/"></div>
    <div id="rules" class="tab-content" data-src="https://ftcf20-hub.github.io/Loneportal/"></div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[99] glass-panel rounded-3xl p-1.5 flex items-center border border-white/10 max-w-xs w-full justify-between">
        <button type="button" data-target="ledger" onclick="switchTab('ledger', this)" class="tab-btn flex-1 py-3 flex items-center justify-center text-slate-400">
            <i data-lucide="wallet" class="w-5 h-5"></i>
        </button>
        <button type="button" data-target="monthly" onclick="switchTab('monthly', this)" class="tab-btn flex-1 py-3 flex items-center justify-center text-slate-400">
            <i data-lucide="calendar-check-2" class="w-5 h-5"></i>
        </button>
        <a href="https://chat.whatsapp.com/KuEfcgvGkOQHFY03h4IuHV?s=cl&p=a&ilr=1&amv=3" target="_blank" class="bg-amber-500 text-black w-11 h-11 flex items-center justify-center rounded-2xl font-bold mx-1">
            <i data-lucide="message-circle" class="w-5 h-5"></i>
        </a>
        <button type="button" data-target="yearly" onclick="switchTab('yearly', this)" class="tab-btn flex-1 py-3 flex items-center justify-center text-slate-400">
            <i data-lucide="trending-up" class="w-5 h-5"></i>
        </button>
        <button type="button" data-target="rules" onclick="switchTab('rules', this)" class="tab-btn flex-1 py-3 flex items-center justify-center text-slate-400">
            <i data-lucide="scale" class="w-5 h-5"></i>
        </button>
    </nav>

    <script>
        const PIN_KEY = "ftcf_pin_v2";
        let enteredPin = "";
        let confirmPin = "";
        let isSettingPin = false;

        function initPasscode() {
            const savedPin = localStorage.getItem(PIN_KEY);
            const title = document.getElementById('lock-title');
            const subtitle = document.getElementById('lock-subtitle');

            enteredPin = "";
            confirmPin = "";
            updateDots();

            if (!savedPin) {
                isSettingPin = true;
                title.innerText = "Set Security PIN";
                subtitle.innerText = "Set a 4-digit PIN for first-time protection";
            } else {
                isSettingPin = false;
                title.innerText = "Enter Security PIN";
                subtitle.innerText = "Enter 4-digit PIN to open dashboard";
            }
        }

        function pressPin(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updateDots();
                if (enteredPin.length === 4) {
                    setTimeout(handlePinComplete, 100);
                }
            }
        }

        function deletePin() {
            if (enteredPin.length > 0) {
                enteredPin = enteredPin.slice(0, -1);
                updateDots();
            }
        }

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (dot) {
                    if (i < enteredPin.length) dot.classList.add('filled');
                    else dot.classList.remove('filled');
                }
            }
        }

        function handlePinComplete() {
            const savedPin = localStorage.getItem(PIN_KEY);
            const title = document.getElementById('lock-title');
            const subtitle = document.getElementById('lock-subtitle');
            const errorElement = document.getElementById('lock-error');

            if (isSettingPin) {
                if (!confirmPin) {
                    confirmPin = enteredPin;
                    enteredPin = "";
                    updateDots();
                    title.innerText = "Confirm Security PIN";
                    subtitle.innerText = "Re-enter your 4-digit PIN to confirm";
                } else {
                    if (enteredPin === confirmPin) {
                        localStorage.setItem(PIN_KEY, enteredPin);
                        openDashboard();
                    } else {
                        errorElement.innerText = "PIN match nahi hua. Reset karke dubara karein.";
                        confirmPin = "";
                        enteredPin = "";
                        updateDots();
                        title.innerText = "Set Security PIN";
                        subtitle.innerText = "Set a 4-digit PIN for first-time protection";
                        setTimeout(() => { errorElement.innerText = ""; }, 2500);
                    }
                }
            } else {
                if (enteredPin === savedPin) {
                    openDashboard();
                } else {
                    errorElement.innerText = "Galat PIN. Phir se enter karein.";
                    enteredPin = "";
                    updateDots();
                    setTimeout(() => { errorElement.innerText = ""; }, 2000);
                }
            }
        }

        function openDashboard() {
            document.getElementById('lock-screen').style.display = 'none';
            switchTab('ledger', document.querySelector('[data-target="ledger"]'));
        }

        function resetPinStorage() {
            localStorage.removeItem(PIN_KEY);
            initPasscode();
        }

        function switchTab(id, btnElement) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('text-amber-500', 'bg-white/5')); 
            
            const target = document.getElementById(id);
            if (target) {
                target.classList.add('active');
                if (!target.querySelector('iframe')) {
                    const iframe = document.createElement('iframe');
                    iframe.src = target.getAttribute('data-src');
                    target.appendChild(iframe);
                }
            }
            if (btnElement) btnElement.classList.add('text-amber-500', 'bg-white/5');
        }

        function toggleModal(id, show) {
            const m = document.getElementById(id);
            if (m) m.classList.toggle('hidden', !show);
        }

        window.onload = function() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            initPasscode();
        };
    </script>
</body>
</html>
