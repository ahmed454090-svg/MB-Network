    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { 
            background-color: #030712; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            margin: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-panel { 
            background: rgba(17, 24, 39, 0.75); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .tab-content { display: none; height: 100vh; width: 100vw; position: relative; }
        .tab-content.active { display: block; }
        iframe { width: 100%; height: 100%; border: none; }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* CIRCLE ANIMATION */
        .splash-circle-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .outer-blue-circle {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #38bdf8;
            border-right-color: #0284c7;
            animation: spinClockwise 2.5s linear infinite;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .inner-white-circle {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 2px dashed #ffffff;
            animation: spinCounterClockwise 1.8s linear infinite;
            opacity: 0.9;
        }

        @keyframes spinClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinCounterClockwise { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

        .pulse-subtext { animation: pulseSubtext 1.8s ease-in-out infinite alternate; }
        @keyframes pulseSubtext { from { opacity: 0.6; letter-spacing: 0.2em; } to { opacity: 1; letter-spacing: 0.3em; } }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(245, 158, 11, 0.5);
            transition: all 0.2s ease;
        }
        .pin-dot.filled {
            background-color: #f59e0b;
            border-color: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }
    </style>
</head>

    <script>
        let enteredPin = "";
        let tempFirstPin = "";
        let isSettingPin = false;

        function checkPasscodeFlow() {
            let savedPin = null;
            try {
                savedPin = localStorage.getItem('user_portal_pin');
            } catch (e) {
                console.warn("Storage access failed:", e);
            }

            const title = document.getElementById('lock-title');
            const subtitle = document.getElementById('lock-subtitle');

            enteredPin = "";
            tempFirstPin = "";
            updatePinDots();

            if (!savedPin || savedPin.trim() === "") {
                isSettingPin = true;
                title.innerText = "Set Security PIN";
                subtitle.innerText = "Choose a 4-digit PIN for portal protection";
            } else {
                isSettingPin = false;
                title.innerText = "Enter Security PIN";
                subtitle.innerText = "Enter your 4-digit passcode to proceed";
            }
        }

        function pressPin(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updatePinDots();
                if (enteredPin.length === 4) {
                    setTimeout(validatePin, 100);
                }
            }
        }

        function deletePin() {
            if (enteredPin.length > 0) {
                enteredPin = enteredPin.slice(0, -1);
                updatePinDots();
            }
        }

        function updatePinDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (dot) {
                    if (i < enteredPin.length) dot.classList.add('filled');
                    else dot.classList.remove('filled');
                }
            }
        }

        function unlockPortal() {
            const lockModal = document.getElementById('lock-screen');
            if (lockModal) lockModal.style.display = 'none';
            enteredPin = "";
            
            let lastTab = 'ledger';
            try {
                lastTab = localStorage.getItem('activeTab') || 'ledger';
            } catch (e) {}

            const targetBtn = document.querySelector(`button[data-target="${lastTab}"]`);
            switchTab(lastTab, targetBtn);
        }

        function validatePin() {
            let savedPin = null;
            try {
                savedPin = localStorage.getItem('user_portal_pin');
            } catch (e) {}

            const errorElement = document.getElementById('lock-error');
            const title = document.getElementById('lock-title');
            const subtitle = document.getElementById('lock-subtitle');

            if (isSettingPin) {
                if (!tempFirstPin) {
                    tempFirstPin = enteredPin;
                    enteredPin = "";
                    updatePinDots();
                    title.innerText = "Confirm Security PIN";
                    subtitle.innerText = "Re-enter your 4-digit PIN to confirm";
                } else {
                    if (enteredPin === tempFirstPin) {
                        try {
                            localStorage.setItem('user_portal_pin', enteredPin);
                        } catch (e) {}
                        tempFirstPin = "";
                        isSettingPin = false;
                        unlockPortal();
                    } else {
                        errorElement.innerText = "PIN match nahi hua. Phir se try karein.";
                        tempFirstPin = "";
                        enteredPin = "";
                        updatePinDots();
                        title.innerText = "Set Security PIN";
                        subtitle.innerText = "Choose a 4-digit PIN for portal protection";
                        setTimeout(() => { if (errorElement) errorElement.innerText = ""; }, 2000);
                    }
                }
            } else {
                if (enteredPin === savedPin) {
                    unlockPortal();
                } else {
                    errorElement.innerText = "Galat PIN! Dubara enter karein.";
                    enteredPin = "";
                    updatePinDots();
                    setTimeout(() => { if (errorElement) errorElement.innerText = ""; }, 2000);
                }
            }
        }

        function forceResetPIN() {
            try {
                localStorage.removeItem('user_portal_pin');
            } catch (e) {}
            checkPasscodeFlow();
        }

        function switchTab(id, btnElement) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('text-amber-500', 'bg-white/5')); 
            
            const targetContainer = document.getElementById(id);
            if (!targetContainer) return;

            targetContainer.classList.add('active');

            if (!targetContainer.querySelector('iframe')) {
                const shimmerLoader = document.createElement('div');
                shimmerLoader.className = 'absolute inset-0 shimmer flex items-center justify-center';
                shimmerLoader.innerHTML = `<span class="text-xs font-mono text-slate-500">Loading...</span>`;
                targetContainer.appendChild(shimmerLoader);

                const iframe = document.createElement('iframe');
                iframe.src = targetContainer.getAttribute('data-src');
                iframe.onload = () => shimmerLoader.remove();
                targetContainer.appendChild(iframe);
            }
            
            if (btnElement) {
                btnElement.classList.add('text-amber-500', 'bg-white/5');
            }
            
            try {
                localStorage.setItem('activeTab', id); 
            } catch (e) {}
        }

        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (modal) {
                if (show) modal.classList.remove('hidden');
                else modal.classList.add('hidden');
            }
        }

        function copyAccount(num) {
