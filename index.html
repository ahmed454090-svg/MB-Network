<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FTCF | Secure Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient Lighting Mesh Glows */
        .ambient-glow-1 {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            z-index: 0;
            filter: blur(40px);
        }

        .bank-gradient { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.25);
        }

        .bank-gradient::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.2), transparent 60%);
            pointer-events: none;
        }

        /* Executive Glassmorphism */
        .glass-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.08);
            border-color: rgba(16, 185, 129, 0.3);
            background: #ffffff;
        }

        /* Progress Bar Animation */
        .progress-fill {
            transition: width 1s ease-in-out;
        }

        /* Shimmer Skeleton Loader */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Live Pulse Dot */
        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="pb-8 relative antialiased selection:bg-emerald-100">

    <div class="ambient-glow-1"></div>

    <main class="w-full max-w-md mx-auto px-4 pt-5 space-y-5 relative z-20">

        <!-- Top App Bar -->
        <header class="flex justify-between items-center px-1">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-slate-900 text-emerald-400 flex items-center justify-center font-black text-xs shadow-md border border-slate-700">
                    FT
                </div>
                <div>
                    <h1 class="text-xs font-black uppercase tracking-wider text-slate-800">Family Trust</h1>
                    <p class="text-[9px] font-bold text-slate-400">Secure Ledger</p>
                </div>
            </div>
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-slate-200 shadow-sm text-[10px] font-bold text-slate-600">
                <span class="pulse-dot"></span> <span>Live Sync</span>
            </div>
        </header>

        <!-- Executive Hero Banner -->
        <div class="bank-gradient text-white p-6 rounded-3xl relative">
            <div class="flex justify-between items-start mb-4">
                <span class="text-[9px] font-black uppercase tracking-[0.25em] text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20 backdrop-blur-md">
                    Rs. 500 / Member
                </span>
                <i class="fas fa-shield-halved text-slate-400 text-sm"></i>
            </div>
            
            <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">Monthly Collection</p>
            
            <div class="mt-4 bg-white/5 p-4 rounded-2xl border border-white/10 backdrop-blur-lg space-y-3">
                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-[9px] uppercase font-bold tracking-widest text-slate-400">Current Period</p>
                        <p id="month-display" class="font-extrabold text-sm text-slate-100 mt-0.5">
                            <span class="inline-block h-4 w-20 skeleton rounded"></span>
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] uppercase font-bold tracking-widest text-slate-400">Total Fund</p>
                        <p id="total-collection" class="font-black text-2xl text-emerald-400 tracking-tight mt-0.5">Rs. 0</p>
                    </div>
                </div>

                <!-- Target Progress Bar -->
                <div class="pt-2 border-t border-white/10">
                    <div class="flex justify-between items-center text-[10px] font-bold mb-1.5">
                        <span class="text-slate-400 uppercase tracking-wider">Target Goal</span>
                        <span id="target-percent" class="text-emerald-400">0%</span>
                    </div>
                    <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-white/10">
                        <div id="progress-bar-fill" class="progress-fill h-full bg-gradient-to-r from-emerald-500 to-teal-400 rounded-full w-0"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- KPI Metrics Grid -->
        <div class="grid grid-cols-2 gap-3">
            <div class="glass-card p-3.5 rounded-2xl flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-xs border border-emerald-100 shrink-0">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div>
                    <p class="text-[9px] font-bold uppercase tracking-wider text-slate-400">Paid Members</p>
                    <p id="paid-count" class="text-sm font-extrabold text-slate-800">0</p>
                </div>
            </div>

            <div class="glass-card p-3.5 rounded-2xl flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center font-bold text-xs border border-rose-100 shrink-0">
                    <i class="fas fa-clock"></i>
                </div>
                <div>
                    <p class="text-[9px] font-bold uppercase tracking-wider text-slate-400">Pending</p>
                    <p id="unpaid-count" class="text-sm font-extrabold text-slate-800">0</p>
                </div>
            </div>
        </div>

        <!-- Search & Filters -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">Members Directory</h3>
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Live Status</span>
            </div>

            <div class="relative">
                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" placeholder="Search member name..." 
                       class="w-full pl-9 pr-4 py-2.5 rounded-2xl bg-white border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 shadow-sm transition-all">
            </div>

            <!-- Members List -->
            <div id="member-list" class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1">
                <div class="p-4 rounded-2xl bg-white border border-slate-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full skeleton shrink-0"></div>
                        <div class="space-y-1">
                            <div class="h-3.5 w-28 skeleton rounded"></div>
                            <div class="h-2.5 w-16 skeleton rounded"></div>
                        </div>
                    </div>
                    <div class="space-y-1 text-right">
                        <div class="h-3.5 w-16 skeleton rounded"></div>
                        <div class="h-3 w-12 skeleton rounded ml-auto"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <div class="text-center opacity-40 text-[9px] font-black uppercase tracking-[0.25em] pt-2 text-slate-400">
            @FTCF2026 Founder Mughal Brothers
        </div>
    </main>

    <script>
        const SHEET_ID = "1hUEigyVt9FcLdeT-2G44mcUMo-r3gSb7AN0XcXilMVw";
        const BASE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        async function loadDashboardData() {
            try {
                // Fetch Month
                const monthRes = await fetch(`${BASE_URL}&range=H1`);
                const monthTxt = await monthRes.text();
                const monthJson = JSON.parse(monthTxt.substring(47).slice(0, -2));
                document.getElementById('month-display').innerText = monthJson.table.rows[0]?.c[0]?.v || "N/A";

                // Fetch Members
                const dataRes = await fetch(`${BASE_URL}&range=A2:E100`);
                const dataTxt = await dataRes.text();
                const dataJson = JSON.parse(dataTxt.substring(47).slice(0, -2));
                renderMembers(dataJson.table.rows);
            } catch (err) {
                document.getElementById('member-list').innerHTML = "<p class='text-center text-xs text-rose-500 font-bold py-6'>Error: Sheet access denied.</p>";
            }
        }

        function renderMembers(rows) {
            const list = document.getElementById('member-list');
            list.innerHTML = '';
            let total = 0;
            let paidNum = 0;
            let unpaidNum = 0;
            let totalMembers = 0;

            rows.forEach(row => {
                if(!row.c[0]) return;
                totalMembers++;
                const name = row.c[0].v;
                const amount = row.c[1]?.v || 0;
                const status = row.c[2]?.v || "UNPAID";
                
                const isPaid = status.toUpperCase() === 'PAID';
                if(isPaid) {
                    total += amount;
                    paidNum++;
                } else {
                    unpaidNum++;
                }

                const card = document.createElement('div');
                card.className = "glass-card p-3 rounded-2xl flex items-center justify-between border border-slate-100";
                card.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0 pr-2">
                        <div class="w-10 h-10 rounded-full bg-slate-900 text-emerald-400 flex items-center justify-center font-bold text-xs shrink-0 shadow-sm border border-slate-800">
                            ${name.charAt(0)}
                        </div>
                        <div class="min-w-0">
                            <h4 class="font-bold text-slate-800 text-xs truncate uppercase tracking-wide">${name}</h4>
                            <p class="text-[9px] font-semibold text-slate-400 uppercase tracking-wider">Trust Member</p>
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                        <p class="font-black text-slate-900 text-xs">Rs. ${amount.toLocaleString()}</p>
                        <span class="inline-block text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider mt-0.5 ${isPaid ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
                            ${status}
                        </span>
                    </div>
                `;
                list.appendChild(card);
            });

            document.getElementById('total-collection').innerText = `Rs. ${total.toLocaleString()}`;
            document.getElementById('paid-count').innerText = paidNum;
            document.getElementById('unpaid-count').innerText = unpaidNum;

            // Target Progress Calculation (Target = Total Members * Rs. 500)
            const targetAmount = totalMembers > 0 ? totalMembers * 500 : 10000;
            const percentage = Math.min(Math.round((total / targetAmount) * 100), 100);
            
            document.getElementById('target-percent').innerText = `${percentage}% (${total.toLocaleString()}/${targetAmount.toLocaleString()})`;
            document.getElementById('progress-bar-fill').style.width = `${percentage}%`;
        }

        loadDashboardData();

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('#member-list > div').forEach(card => {
                const name = card.querySelector('h4').innerText.toLowerCase();
                card.style.display = name.includes(term) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
